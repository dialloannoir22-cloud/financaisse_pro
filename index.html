<!doctype html>

    <script>
      (function() {
        // Ignorer et neutraliser les erreurs WebSocket HMR / @vite/client en environnement Cloud Run iframe
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          var file = (e && e.filename) ? String(e.filename) : '';
          if (
            msg.includes('WebSocket') || 
            msg.includes('createWebSocketModuleRunnerTransport') || 
            msg.includes('@vite/client') ||
            file.includes('@vite/client')
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (
            reason.includes('WebSocket') || 
            reason.includes('createWebSocketModuleRunnerTransport') || 
            reason.includes('@vite/client')
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
